name: ✨ Feature Request
description: Suggest an idea or architectural improvement for Brain.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Brain! Please describe your proposed feature or enhancement.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: E.g., I am frustrated when vector similarity queries take >10ms on large databases.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, code snippets, or diagrams about the feature request here.
