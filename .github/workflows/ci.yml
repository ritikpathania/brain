name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Run Clippy
        run: |
          PYO3_PYTHON=python3 cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Format (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff format --check .

      - name: Check Python Lint (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff check .

  msrv-check:
    name: MSRV Check (Rust 1.80.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust MSRV
        uses: dtolnay/rust-toolchain@1.80.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace MSRV
        run: cargo check --workspace --all-targets

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Run Type Checking
        run: |
          cd daemon
          uv run --no-sync ty check
          uv run --no-sync pyrefly check

  docs-and-contracts:
    name: Docs & Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Contracts
        run: cargo xtask verify-contracts

      - name: Verify Documentation Governance
        run: cargo xtask docs all

  test-and-bench:
    name: Tests & Benchmark Compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-format, msrv-check, docs-and-contracts]
    env:
      PYO3_PYTHON: python3
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Build PyO3 Bridge (Maturin)
        run: |
          cd daemon
          uv run maturin develop

      - name: Run Rust Test Suite
        run: |
          cargo test --workspace

      - name: Run Python Test Suite
        run: |
          cd daemon
          uv run --no-sync pytest

      - name: Verify Benchmark Compilation
        run: |
          cargo bench --workspace --no-run
