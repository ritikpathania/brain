name: CI

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Run Clippy
        run: |
          PYO3_PYTHON=python3 cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Format (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff format --check .

      - name: Check Python Lint (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff check .

  msrv-check:
    name: MSRV Check (Rust 1.80.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust MSRV
        uses: dtolnay/rust-toolchain@1.80.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace MSRV
        run: cargo check --workspace --all-targets

  xtask-verify-gate:
    name: Quality Gate (cargo xtask verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Build PyO3 Bridge (Maturin)
        run: |
          cd daemon
          uv run maturin develop

      - name: Run xtask verify Quality Gate
        run: |
          PYO3_PYTHON=python3 cargo xtask verify

  sdk-and-packaging:
    name: Python SDK & Package Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-format, xtask-verify-gate]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies & Build Maturin Bridge
        run: |
          cd daemon
          uv sync --no-install-project
          uv run maturin develop

      - name: Run Python SDK Test Suite
        run: |
          PYTHONPATH=sdks/python/src python3 -m pytest sdks/python/tests/ -v

      - name: Verify Release Packaging Script (package.sh)
        run: |
          bash package.sh
          TAR_FILE=$(ls brain-*.tar.gz | head -n 1)
          echo "Found generated package: ${TAR_FILE}"
          
          # Inspect tarball contents
          MANIFEST=$(tar -tzf ${TAR_FILE})
          echo "${MANIFEST}"
          
          # Assert both brain and brain-daemon binaries exist in archive
          echo "${MANIFEST}" | grep -q "brain$" || (echo "ERROR: brain binary missing from package" && exit 1)
          echo "${MANIFEST}" | grep -q "brain-daemon$" || (echo "ERROR: brain-daemon binary missing from package" && exit 1)
          
          # Unpack and verify binary execution
          mkdir -p /tmp/pkg_verify
          tar -xzf ${TAR_FILE} -C /tmp/pkg_verify
          /tmp/pkg_verify/brain-daemon --version
          
          # Test exit code semantics (brain health when daemon unreachable should exit 1)
          /tmp/pkg_verify/brain health || [ $? -eq 1 ]
