name: CI

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Run Clippy
        run: |
          PYO3_PYTHON=python3 cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Format (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff format --check .

      - name: Check Python Lint (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff check .

  xtask-verify-gate:
    name: Quality Gate (cargo xtask verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Build PyO3 Bridge (Maturin)
        run: |
          cd daemon
          uv run maturin develop

      - name: Run xtask verify Quality Gate
        run: |
          PYO3_PYTHON=python3 cargo xtask verify

  sdk-and-packaging:
    name: Python SDK & Package Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-format, xtask-verify-gate]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies & Build Maturin Bridge
        run: |
          cd daemon
          uv sync --no-install-project
          uv run maturin develop

      - name: Run Python SDK Test Suite
        run: |
          cd daemon
          PYTHONPATH=../sdks/python uv run pytest ../sdks/python/tests/ -v

      - name: Verify Release Packaging Script (package.sh)
        run: |
          bash package.sh
          TAR_FILE=$(ls brain-*.tar.gz | head -n 1)
          echo "Found generated package: ${TAR_FILE}"
          
          # Inspect tarball contents
          MANIFEST=$(tar -tzf ${TAR_FILE})
          echo "${MANIFEST}"
          
          # Assert both brain and brain-daemon binaries exist in archive
          echo "${MANIFEST}" | grep -q "brain$" || (echo "ERROR: brain binary missing from package" && exit 1)
          echo "${MANIFEST}" | grep -q "brain-daemon$" || (echo "ERROR: brain-daemon binary missing from package" && exit 1)
          
          # Unpack and verify binary execution
          mkdir -p /tmp/pkg_verify
          tar -xzf ${TAR_FILE} -C /tmp/pkg_verify
          /tmp/pkg_verify/brain-daemon --version
          
          # Test exit code semantics (brain health when daemon unreachable should exit 1)
          /tmp/pkg_verify/brain health || [ $? -eq 1 ]

  docs-validation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Documentation Quality Gate
        run: cargo xtask docs all

  canonical-frontend:
    name: First-party frontend and real-daemon E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Set up the locked frontend Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build CLI and daemon for the actual launcher and frontend E2E
        run: >-
          PYO3_PYTHON="${{ steps.python.outputs.python-path }}"
          cargo build -p brain -p brain-daemon --locked

      - name: Install the first-party frontend from its lockfile
        working-directory: packages/brain-frontend
        run: bun install --frozen-lockfile

      - name: Type-check the first-party frontend
        working-directory: packages/brain-frontend
        run: bun run typecheck

      - name: Run owned protocol, state, interaction, and rendering tests
        working-directory: packages/brain-frontend
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
          HOME: ${{ runner.temp }}/brain-frontend-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/brain-frontend-home/config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          bun run test

      - name: Require real-daemon and actual brain ui PTY tests with zero skips
        env:
          HOME: ${{ runner.temp }}/brain-frontend-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/brain-frontend-home/config
          BRAIN_DAEMON_BIN: ${{ github.workspace }}/target/debug/brain-daemon
          BRAIN_CLI_BIN: ${{ github.workspace }}/target/debug/brain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          ./scripts/verify-frontend-e2e.sh
