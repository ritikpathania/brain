name: CI

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Run Clippy
        run: |
          PYO3_PYTHON=python3 cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Format (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff format --check .

      - name: Check Python Lint (Ruff)
        run: |
          cd daemon
          uv run --no-sync ruff check .

  xtask-verify-gate:
    name: Quality Gate (cargo xtask verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: |
          cd daemon
          uv sync --no-install-project

      - name: Run xtask verify Quality Gate
        run: |
          PYO3_PYTHON=python3 cargo xtask verify

  sdk-and-packaging:
    name: Python SDK & Package Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-format, xtask-verify-gate]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf build-essential

      - name: Set up the locked frontend Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.13.8'
          enable-cache: true

      - name: Sync Daemon Dependencies
        id: python
        working-directory: daemon
        run: |
          uv sync --frozen --no-install-project --managed-python --python "$(cat .python-version)"
          python_path="$PWD/.venv/bin/python"
          printf 'python-path=%s\n' "$python_path" >> "$GITHUB_OUTPUT"

      - name: Run Python SDK Test Suite
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          cd daemon
          PYTHONPATH=../sdks/python uv run --no-sync pytest ../sdks/python/tests/ -v

      - name: Verify Release Packaging Script (package.sh)
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          bash package.sh
          archives=(brain-*.tar.gz)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]] || { echo "ERROR: expected exactly one generated package"; exit 1; }
          TAR_FILE="${archives[0]}"
          echo "Found generated package: ${TAR_FILE}"

          # Inspect tarball contents
          MANIFEST=$(tar -tzf "${TAR_FILE}")
          echo "${MANIFEST}"

          # Assert closed product layout binaries and manifests exist in archive
          grep -Fxq 'brain-dist/bin/brain' <<< "$MANIFEST" || { echo "ERROR: brain-dist/bin/brain missing from package"; exit 1; }
          grep -Fxq 'brain-dist/bin/brain-daemon' <<< "$MANIFEST" || { echo "ERROR: brain-dist/bin/brain-daemon missing from package"; exit 1; }
          grep -Fxq 'brain-dist/frontend/brain-frontend/brain-frontend' <<< "$MANIFEST" || { echo "ERROR: standalone frontend missing from package"; exit 1; }
          grep -Fxq 'brain-dist/product-manifest.json' <<< "$MANIFEST" || { echo "ERROR: product-manifest.json missing from package"; exit 1; }

          # Unpack and verify binary execution from canonical brain-dist/bin/ paths
          verify_dir="$(mktemp -d "$RUNNER_TEMP/brain-package-check.XXXXXX")"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "${TAR_FILE}" -C "$verify_dir"
          "$verify_dir/brain-dist/bin/brain-daemon" --version

          # Test exit code semantics (brain health when daemon unreachable should exit 1)
          "$verify_dir/brain-dist/bin/brain" health || [ $? -eq 1 ]

  docs-validation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Documentation Quality Gate
        run: cargo xtask docs all

  canonical-frontend:
    name: First-party frontend and real-daemon E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Set up the locked frontend Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build CLI and daemon for the actual launcher and frontend E2E
        run: >-
          PYO3_PYTHON="${{ steps.python.outputs.python-path }}"
          cargo build -p brain -p brain-daemon --locked

      - name: Install the first-party frontend from its lockfile
        working-directory: packages/brain-frontend
        run: bun install --frozen-lockfile

      - name: Type-check the first-party frontend
        working-directory: packages/brain-frontend
        run: bun run typecheck

      - name: Run owned protocol, state, interaction, and rendering tests
        working-directory: packages/brain-frontend
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
          HOME: ${{ runner.temp }}/brain-frontend-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/brain-frontend-home/config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          bun run test

      - name: Require real-daemon and actual brain ui PTY tests with zero skips
        env:
          HOME: ${{ runner.temp }}/brain-frontend-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/brain-frontend-home/config
          BRAIN_DAEMON_BIN: ${{ github.workspace }}/target/debug/brain-daemon
          BRAIN_CLI_BIN: ${{ github.workspace }}/target/debug/brain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          ./scripts/verify-frontend-e2e.sh
