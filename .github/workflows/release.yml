name: Release Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: brain-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: brain-macos-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies & Maturin Bridge
        run: |
          cd daemon
          uv sync --no-install-project
          uv run maturin develop

      - name: Build Standalone Binaries (brain & brain-daemon)
        run: |
          PYO3_PYTHON=python3 cargo build --release --package brain --target ${{ matrix.target }}
          PYO3_PYTHON=python3 cargo build --release --manifest-path daemon/Cargo.toml --bin brain-daemon --target ${{ matrix.target }}
          
          mkdir -p release_staging
          cp target/${{ matrix.target }}/release/brain release_staging/brain
          if [ -f daemon/target/${{ matrix.target }}/release/brain-daemon ]; then
            cp daemon/target/${{ matrix.target }}/release/brain-daemon release_staging/brain-daemon
          else
            cp target/${{ matrix.target }}/release/brain-daemon release_staging/brain-daemon
          fi
          cp README.md release_staging/README.md
          cp CHANGELOG.md release_staging/CHANGELOG.md
          cp LICENSE release_staging/LICENSE 2>/dev/null || true
          cp -r docs release_staging/docs

          TAR_NAME="${{ matrix.artifact_name }}.tar.gz"
          tar -czf ${TAR_NAME} -C release_staging .

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz

  publish-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts/ -type f -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Brain ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*
            CHANGELOG.md
            LICENSE
