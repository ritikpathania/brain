[package]
name = "brain-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "daemon_bridge"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "brain-daemon"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.21.0", features = ["auto-initialize"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
libc = "0.2"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
brain-domain = { path = "../crates/brain-domain" }
brain-integrations = { path = "../crates/brain-integrations" }
brain-core = { path = "../crates/brain-core" }
brain-services = { path = "../crates/brain-services" }
reqwest = { workspace = true }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
jsonschema = "0.17"



