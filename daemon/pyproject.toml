[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-daemon-tests"
version = "1.1.0"
description = "Standalone Relational Memory Engine Daemon Test Harness"
requires-python = ">=3.15"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.1",
    "ty",
    "pyrefly",
    "pytest",
    "hypothesis",
    "jsonschema",
    "referencing",
]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = []


[tool.ty.environment]
extra-paths = ["."]

[tool.ty.src]
include = ["brain/**/*.py", "tests/**/*.py"]
exclude = []

[tool.pyrefly]
search_path = ["."]
