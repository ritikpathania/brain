[package]
name = "brain-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
ratatui = "0.26"
crossterm = "0.27"
async-trait = "0.1"
uuid.workspace = true
thiserror.workspace = true
brain-observability = { path = "../brain-observability", optional = true }
brain-domain = { path = "../brain-domain" }
brain-core = { path = "../brain-core" }
brain-integrations = { path = "../brain-integrations" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ui_benchmarks"
harness = false

