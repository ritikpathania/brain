[package]
name = "brain-services"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
brain-domain = { path = "../brain-domain" }
brain-core = { path = "../brain-core" }
brain-session = { path = "../brain-session" }
brain-config = { path = "../brain-config" }
brain-storage = { path = "../brain-storage" }
brain-plugins = { path = "../brain-plugins" }
brain-python = { path = "../brain-python" }
brain-tools = { path = "../brain-tools" }
brain-events = { path = "../brain-events" }
brain-observability = { path = "../brain-observability" }
parking_lot = "0.12"
pyo3 = { workspace = true }
r2d2.workspace = true
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde", "clock"] }
async-trait = "0.1"
tokio-util = "0.7"

[dev-dependencies]
brain-storage = { path = "../brain-storage", features = ["test-utils"] }
criterion = "0.5"

[[bench]]
name = "policy_benchmarks"
harness = false

[[bench]]
name = "retrieval_baseline_benchmarks"
harness = false

