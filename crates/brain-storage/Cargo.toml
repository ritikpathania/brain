[package]
name = "brain-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite.workspace = true
r2d2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
ulid.workspace = true
brain-domain = { path = "../brain-domain" }
brain-core = { path = "../brain-core" }
brain-integrations = { path = "../brain-integrations" }
chrono = { version = "0.4", features = ["serde", "clock"] }

[features]
test-utils = []

[dev-dependencies]
brain-storage = { path = ".", features = ["test-utils"] }


