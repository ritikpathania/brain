[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-sdk"
version = "0.1.0"
description = "Python SDK for Brain integration events"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "ty",
    "jsonschema>=4.20",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.ty.src]
include = ["brain_sdk/**/*.py", "tests/**/*.py"]
