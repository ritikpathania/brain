[workspace]
resolver = "2"
members = [
    "crates/brain-domain",
    "crates/brain-core",
    "crates/brain-events",
    "crates/brain-storage",
    "crates/brain-config",
    "crates/brain-session",
    "crates/brain-tools",
    "crates/brain-plugins",
    "crates/brain-python",
    "crates/brain-tui",
    "crates/brain-services",
    "crates/brain-observability",
    "crates/brain-integrations",
    "crates/brain-sdk-rs",
    "crates/brain-cli-adapter",
    "crates/brain-application",
    "crates/brain-mcp-adapter",
    "crates/brain-acp-adapter",
    "crates/brain-adapter-core",
    "crates/brain-a2a-adapter",
    "apps/brain-v2",
    "xtask",
    "daemon",
]



[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
r2d2 = "0.8"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
ulid = { version = "1.1", features = ["serde"] }
tracing = "0.1"
pyo3 = { version = "0.21.0", features = ["auto-initialize"] }
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
semver = "1.0"
specta = { version = "1.0.5", features = ["serde", "typescript"] }
